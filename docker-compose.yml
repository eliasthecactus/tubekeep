services:
  tubekeep:
    build: .
    image: ghcr.io/eliasthecactus/tubekeep:latest
    container_name: tubekeep
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # creates the first account on the first start (otherwise the web UI asks for it)
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=change-me-please
    volumes:
      - ./container/tubekeep/config:/config
      - ./container/tubekeep/downloads:/downloads
      # more folders a playlist can download to, pick them in the playlist settings:
      # - /mnt/hdd/music:/music
